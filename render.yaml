services:
  # ---------------------------------------------------------------------------
  # 1. ZeroShield Backend API Service (Node.js Express + Prisma)
  # ---------------------------------------------------------------------------
  - type: web
    name: zeroshield-backend
    runtime: node
    region: singapore
    rootDir: server
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL
        value: 7d
      - key: BCRYPT_SALT_ROUNDS
        value: 12
      - key: COOKIE_SECURE
        value: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

  # ---------------------------------------------------------------------------
  # 2. ZeroShield Frontend Web Application (Vite + React Static Site)
  # ---------------------------------------------------------------------------
  - type: web
    name: zeroshield-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: zeroshield-backend
          property: host
